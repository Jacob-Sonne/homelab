services:
  kavita:
    image: jvmilazz0/kavita:latest

    container_name: kavita

    restart: unless-stopped

    ports:
      - "5000:5000"
    
    environment:
      - TZ=Europe/Copenhagen

    volumes:
      - /srv/appdata/kavita:/kavita/config
      - /mnt/media/manga:/manga
      - /mnt/media/comics:/comics
      - /mnt/media/books:/books
